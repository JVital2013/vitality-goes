[general]
;siteTitle = "My GOES-19 Data"
;siteTheme = "light"
;satdumpAPI = http://127.0.0.1:8080/api
adminPath = "F:\path\to\satdumpdata\Admin Messages"
emwinPath = "F:\path\to\satdumpdata\EMWIN"
